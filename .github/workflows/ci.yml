name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The gate every maintainer runs before the push (SDLC.md section 3): the fake robot, then the ROS 2 testbed in
      # a container (the runner's Docker). A surface the spec refuses fails the build. CI never needs a robot.
      - run: scripts/gate.sh all
